services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_DB: nnittrader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

  redis:
    image: redis

    ports:
      - "6379:6379"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: nnittrader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - postgres
      - redis